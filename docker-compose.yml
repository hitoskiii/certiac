services:
  caddy:
    build: .
    image: certiac-caddy
    restart: unless-stopped
    # Home Assistant occupe déjà 443 sur ce réseau : certiac vit à côté, sur
    # un port dédié. Le port 80 n'est PAS exposé — on ne s'en sert pas (le
    # challenge est en DNS-01) et une redirection HTTP->HTTPS pointerait vers
    # le port standard, donc vers HA. Mieux vaut ne pas l'ouvrir.
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"   # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les deux fragments du provider choisi dans .env, montés à des chemins
      # fixes. Changer d'hébergeur DNS = changer DNS_PROVIDER, pas de rebuild.
      - ./providers/${DNS_PROVIDER:?DNS_PROVIDER manquant dans .env}.tls.caddyfile:/etc/caddy/dns-tls.caddyfile:ro
      - ./providers/${DNS_PROVIDER}.ddns.caddyfile:/etc/caddy/dns-ddns.caddyfile:ro
      - ./site:/srv/site:ro   # page témoin HTTPS servie sur home.<domaine>
      - caddy_data:/data      # CRITIQUE : certificats + clé de compte ACME
      - caddy_config:/config
      - ./logs:/var/log/caddy
    # Rend l'hôte joignable depuis le conteneur sous le nom
    # "host.docker.internal", y compris sous Linux où il n'existe pas d'office.
    # Indispensable pour viser un service qui tourne en network_mode: host
    # sur la même machine (Plex, par exemple). Voir README §7.1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
      # Pour joindre un service qui vit dans un AUTRE projet compose (seerr,
      # par exemple), rattacher Caddy à son réseau et le viser par son nom :
      #   SEERR_UPSTREAM=seerr:5055
      # C'est plus fiable que de passer par host.docker.internal, qui traverse
      # du NAT et peut produire des "connection reset by peer" sporadiques.
      # Décommenter ici ET dans la section networks en bas.
      # - seerr

volumes:
  caddy_data:     # ne jamais supprimer à la légère : réémission + rate limit
  caddy_config:

networks:
  proxy:
    name: proxy

  # Réseau d'un autre projet compose, déjà existant. Vérifier son nom exact
  # avec : docker network ls
  # seerr:
  #   name: homedl_default
  #   external: true
